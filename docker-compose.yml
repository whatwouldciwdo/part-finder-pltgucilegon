services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PAGES_DIR: /app/data/pages
    volumes:
      - ./data/pages:/app/data/pages:ro
    expose:
      - "8000"

  web:
    build:
      context: ./web
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${APP_PORT:-3230}:80"
